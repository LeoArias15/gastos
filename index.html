<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carne Asada · Gastos</title>
<link rel="icon" href="flavico.ico">
<style>
  /*
    Tokens basados en Apple HIG (iOS 26):
    - Colores del sistema en su variante dark (systemBlue, systemGreen, systemRed…)
      son valores adaptativos community-measured; Apple no publica hex fijos.
    - Tipografia: SF Pro, escala Dynamic Type (Large Title 34 / Body 17 / Footnote 13…)
    - Material Liquid Glass: superficies translucidas con blur + saturacion.
    - Tap targets minimo 44pt, espaciado en multiplos de 8pt.
  */
  :root{
    --system-blue:#0A84FF;
    --system-green:#30D158;
    --system-red:#FF453A;
    --system-orange:#FF9F0A;
    --system-gray:#8E8E93;
    --system-gray2:#636366;

    --bg:#000000;
    --bg-elevated:#1C1C1E;
    --bg-tertiary:#2C2C2E;

    --glass-fill: rgba(38,38,42,0.40);
    --glass-fill-strong: rgba(60,60,66,0.34);
    --glass-border: rgba(255,255,255,0.16);
    --separator: rgba(84,84,88,0.55);
    --fill: rgba(120,120,128,0.24);
    --fill-secondary: rgba(120,120,128,0.16);

    --label:#FFFFFF;
    --label-2:rgba(235,235,245,0.60);
    --label-3:rgba(235,235,245,0.30);

    --radius-l:20px;
    --radius-m:14px;
    --radius-s:10px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
    /* Fondo con una veladura de color muy sutil (como el wallpaper detras del
       Home Screen de iOS): sin esto, el backdrop-filter de las superficies de
       vidrio no tiene nada que refractar y se ve como una barra solida. */
    background:
      radial-gradient(900px 700px at 15% -10%, rgba(10,132,255,0.10), transparent 55%),
      radial-gradient(800px 640px at 100% 0%, rgba(94,92,230,0.08), transparent 55%),
      radial-gradient(1000px 800px at 50% 115%, rgba(48,209,88,0.05), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--label);
    min-height:100%;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  svg{ display:block; }
  .icon{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .icon-sm{ width:18px; height:18px; }

  #app{
    max-width:560px;
    margin:0 auto;
    padding-bottom:calc(100px + var(--safe-bottom));
    min-height:100vh;
    position:relative;
  }

  /* ---------- Nav bar (large title) ---------- */
  .navbar{
    position:sticky;
    top:0;
    z-index:30;
    padding:calc(10px + var(--safe-top)) 20px 12px;
    background:transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-bottom:0.5px solid transparent;
    transition:border-color .25s ease, background .25s ease, backdrop-filter .25s ease;
  }
  /* Solo cuando hay contenido debajo se activa el vidrio, igual que el large
     title de iOS: transparente al tope, se vuelve Liquid Glass al hacer scroll. */
  .navbar.scrolled{
    background:rgba(14,14,16,0.86);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border-color:var(--separator);
    box-shadow:inset 0 -1px 0 rgba(255,255,255,0.05);
  }
  .navbar-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
  }
  .navbar .large-title{
    font-size:34px;
    font-weight:700;
    letter-spacing:0.37px;
    line-height:1.1;
  }
  .navbar .subtitle{
    font-size:15px;
    color:var(--label-2);
    margin-top:2px;
    font-weight:400;
  }
  .nav-btn{
    width:36px;height:36px;
    border-radius:50%;
    border:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--fill);
    color:var(--system-blue);
    flex-shrink:0;
    margin-bottom:2px;
    transition:background .15s ease, transform .12s ease;
  }
  .nav-btn:active{ transform:scale(0.9); background:var(--fill-secondary); }
  .nav-btn.is-admin{ background:rgba(48,209,88,0.16); color:var(--system-green); }

  /* ---------- Tab views ---------- */
  section.view{ display:none; padding:20px 20px 0; animation:rise .28s cubic-bezier(.2,.8,.2,1); }
  section.view.active{ display:block; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Grouped list (estilo Ajustes) ---------- */
  .section-header{
    font-size:13px;
    font-weight:400;
    color:var(--label-2);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin:24px 4px 8px;
  }
  .section-header:first-child{ margin-top:0; }

  .group{
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-l);
    backdrop-filter: blur(24px) saturate(190%);
    -webkit-backdrop-filter: blur(24px) saturate(190%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 1px 24px rgba(0,0,0,0.25);
    overflow:hidden;
  }

  .row{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:44px;
    padding:11px 16px;
    position:relative;
  }
  .row + .row{ border-top:0.5px solid var(--separator); }
  .row.tappable{ cursor:pointer; transition:background .12s ease; }
  .row.tappable:active{ background:var(--fill-secondary); }

  .row-icon{
    width:29px;height:29px;
    border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    color:#fff;
  }
  .row-icon .icon{ width:17px; height:17px; }

  .row-body{ flex:1; min-width:0; }
  .row-title{ font-size:17px; font-weight:400; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-subtitle{ font-size:13px; color:var(--label-2); margin-top:1px; }

  .row-value{ font-size:17px; color:var(--label-2); flex-shrink:0; font-variant-numeric:tabular-nums; }
  .row-value.strong{ color:var(--label); font-weight:590; }

  .chevron{ color:var(--label-3); flex-shrink:0; }
  .chevron .icon{ width:14px; height:14px; stroke-width:2.2; }

  /* ---------- Hero / resumen ---------- */
  .hero{
    padding:28px 20px 24px;
    text-align:center;
  }
  .hero .eyebrow{
    font-size:13px;
    font-weight:590;
    color:var(--label-2);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .hero .amount{
    font-size:48px;
    font-weight:700;
    letter-spacing:0.37px;
    margin:4px 0 2px;
    font-variant-numeric:tabular-nums;
  }
  .hero .sub{ font-size:15px; color:var(--label-2); }

  .metric-pair{ display:flex; gap:12px; margin-bottom:16px; }
  .metric{
    flex:1;
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-l);
    backdrop-filter: blur(24px) saturate(190%);
    -webkit-backdrop-filter: blur(24px) saturate(190%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 1px 24px rgba(0,0,0,0.25);
    padding:14px 16px;
  }
  .metric .k{ font-size:13px; color:var(--label-2); font-weight:400; }
  .metric .v{ font-size:22px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; letter-spacing:0.35px;}

  .avatar{
    width:29px; height:29px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:590;
    color:#fff;
    background:var(--system-gray2);
    flex-shrink:0;
  }

  .paid-toggle{
    width:24px;height:24px;border-radius:50%;
    border:1.5px solid var(--glass-border);
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:background .18s ease, border-color .18s ease;
  }
  .paid-toggle.on{
    background:var(--system-green);
    border-color:var(--system-green);
    color:#fff;
  }

  .pill{
    font-size:13px; font-weight:590; padding:3px 10px; border-radius:8px;
  }
  .pill.pos{ background:rgba(48,209,88,0.16); color:var(--system-green); }
  .pill.neg{ background:rgba(255,69,58,0.16); color:var(--system-red); }
  .pill.zero{ background:var(--fill); color:var(--label-2); }

  .empty{
    text-align:center;
    padding:48px 20px;
  }
  .empty .icon{ width:34px; height:34px; margin:0 auto 12px; color:var(--label-3); }
  .empty .msg{ font-size:17px; font-weight:590; color:var(--label); margin-bottom:4px;}
  .empty .sub{ font-size:15px; color:var(--label-2); }

  /* ---------- Buttons ---------- */
  .btn{
    border:0;
    font-family:inherit;
    font-weight:590;
    font-size:17px;
    border-radius:var(--radius-m);
    padding:13px 18px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .12s ease, opacity .2s ease;
    cursor:pointer;
    min-height:44px;
  }
  .btn:active{ opacity:0.7; }
  .btn-filled{
    background:var(--system-blue);
    color:#fff;
  }
  .btn-gray{
    background:var(--fill);
    color:var(--system-blue);
  }
  .btn-destructive{
    background:var(--fill);
    color:var(--system-red);
  }
  .btn-block{ width:100%; }

  .action-row{ display:flex; gap:10px; margin-top:20px; }

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    justify-content:center;
    padding-bottom:calc(10px + var(--safe-bottom));
    padding-top:10px;
    z-index:50;
    pointer-events:none;
  }
  .tabbar-inner{
    pointer-events:auto;
    position:relative;
    display:flex;
    gap:2px;
    background:var(--glass-fill-strong);
    border:0.5px solid var(--glass-border);
    backdrop-filter: blur(42px) saturate(220%) brightness(1.18);
    -webkit-backdrop-filter: blur(42px) saturate(220%) brightness(1.18);
    border-radius:26px;
    padding:6px;
    overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(255,255,255,0.05), 0 10px 34px rgba(0,0,0,0.5);
  }
  /* Veladura de luz diagonal para simular el reflejo del cristal, como en
     el tab bar nativo de iOS 26. */
  .tabbar-inner::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.02) 35%, rgba(255,255,255,0) 60%);
    pointer-events:none;
    z-index:2;
  }
  .tabbar button{ position:relative; z-index:1; }

  /* Burbuja de arrastre estilo iOS 26: sigue al dedo por el tab bar y
     muestra un borde con aberracion cromatica, como el "scrubber" nativo. */
  .tab-blob{
    position:absolute;
    top:6px; bottom:6px; left:0;
    border-radius:20px;
    background:rgba(255,255,255,0.16);
    backdrop-filter: blur(10px) saturate(220%) brightness(1.3);
    -webkit-backdrop-filter: blur(10px) saturate(220%) brightness(1.3);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 -1px 0 rgba(255,255,255,0.08),
      0 0 0 0.5px rgba(255,255,255,0.3),
      0 0 9px 1px rgba(120,170,255,0.35),
      0 0 12px 2px rgba(255,120,170,0.22),
      0 6px 16px rgba(0,0,0,0.35);
    transition: transform .52s cubic-bezier(.34,1.4,.4,1), width .52s cubic-bezier(.34,1.4,.4,1);
    pointer-events:none;
    z-index:0;
    will-change:transform,width;
  }
  .tab-blob.grabbed{
    transition: none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 -1px 0 rgba(255,255,255,0.1),
      0 0 0 0.5px rgba(255,255,255,0.4),
      0 0 16px 2px rgba(120,170,255,0.55),
      0 0 20px 3px rgba(255,120,170,0.4),
      0 8px 20px rgba(0,0,0,0.4);
  }
  .tabbar button.preview{ color:var(--system-blue); }
  .tabbar button.preview .icon{ stroke-width:2; }
  .tabbar-inner{ touch-action:none; }
  .tabbar button{
    border:0; background:transparent; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:8px 22px 7px;
    border-radius:20px;
    color:var(--label-3);
    font-size:10px; font-weight:590;
    letter-spacing:0.02em;
    min-width:44px;
    transition:color .2s ease;
  }
  .tabbar button .icon{ width:24px; height:24px; stroke-width:1.6; }
  .tabbar button.active{ color:var(--system-blue); }
  .tabbar button.active .icon{ stroke-width:2; }

  /* ---------- Sheet / modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    z-index:90;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:560px;
    margin:0 auto;
    background:rgba(28,28,30,0.80);
    border:0.5px solid var(--glass-border);
    border-bottom:none;
    border-radius:20px 20px 0 0;
    backdrop-filter: blur(34px) saturate(200%);
    -webkit-backdrop-filter: blur(34px) saturate(200%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.10);
    z-index:95;
    padding:8px 20px calc(24px + var(--safe-bottom));
    transform:translateY(100%);
    transition:transform .38s cubic-bezier(.32,.72,0,1);
    max-height:86vh;
    overflow-y:auto;
  }
  .sheet.show{ transform:translateY(0); }
  .grabber{
    width:36px;height:5px;border-radius:3px;
    background:var(--fill);
    margin:6px auto 16px;
  }
  .sheet-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .sheet-header h2{ font-size:17px; font-weight:590; margin:0; }
  .sheet-cancel{
    background:none; border:0; color:var(--system-blue); font-size:17px;
    font-family:inherit; padding:0; min-height:44px; display:flex; align-items:center;
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:13px; font-weight:400; color:var(--label-2);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    font-family:inherit;
    font-size:17px;
    color:var(--label);
    background:var(--fill-secondary);
    border:0.5px solid var(--glass-border);
    border-radius:var(--radius-m);
    padding:12px 14px;
    outline:none;
    min-height:44px;
    transition:background .2s ease;
    -webkit-appearance:none;
    appearance:none;
  }
  .field input:focus, .field select:focus{ background:var(--fill); }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23636366' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M7 10l5 5 5-5'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:18px;
    padding-right:38px;
  }
  .amount-prefix{ position:relative; }
  .amount-prefix .pre{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--label-2); font-size:17px; font-weight:400; pointer-events:none;
  }
  .amount-prefix input{ padding-left:28px; }

  /* Toast */
  .toast{
    position:fixed;
    left:50%; bottom:calc(96px + var(--safe-bottom));
    transform:translateX(-50%) translateY(16px);
    background:var(--glass-fill-strong);
    border:0.5px solid var(--glass-border);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    color:var(--label);
    font-size:14px; font-weight:590;
    padding:11px 18px;
    border-radius:14px;
    z-index:120;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Print / PDF export styles */
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{
      display:block;
      position:absolute; left:0; top:0; width:100%;
      background:#fff; color:#111; padding:32px;
      font-family:-apple-system,system-ui,sans-serif;
    }
    #printArea h1{ font-size:22px; margin:0 0 4px; }
    #printArea .pmeta{ font-size:12px; color:#555; margin-bottom:18px;}
    #printArea table{ width:100%; border-collapse:collapse; font-size:13px; }
    #printArea th, #printArea td{ text-align:left; padding:8px 10px; border-bottom:1px solid #ddd; }
    #printArea th{ color:#555; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
    #printArea .pos{ color:#0a8a3d; font-weight:700; }
    #printArea .neg{ color:#c0392b; font-weight:700; }
    #printArea .totals{ margin-top:20px; font-size:13px; }
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>

<div id="app">

  <!-- RESUMEN -->
  <section class="view active" data-view="resumen">
    <div class="navbar" id="navbar-resumen">
      <div class="navbar-row">
        <div>
          <div class="large-title">Resumen</div>
          <div class="subtitle">Carne asada</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="nav-btn" id="btn-admin" title="Modo administrador">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </button>
          <button class="nav-btn" id="btn-share" title="Compartir link del grupo">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9"/><path d="M8.6 13.5l6.8 3.9"/></svg>
          </button>
          <button class="nav-btn" id="btn-export-pdf" title="Exportar PDF">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div style="padding:0 20px;">
      <div class="hero">
        <div class="eyebrow">Total gastado</div>
        <div class="amount" id="r-total">$0</div>
        <div class="sub" id="r-subtitle">Agrega personas y gastos para empezar</div>
      </div>

      <div class="metric-pair">
        <div class="metric">
          <div class="k">Cuota por persona</div>
          <div class="v" id="r-cuota">$0</div>
        </div>
        <div class="metric">
          <div class="k">Personas</div>
          <div class="v" id="r-personas">0</div>
        </div>
      </div>

      <div class="section-header">Balances</div>
      <div class="group" id="r-balances"></div>
    </div>
  </section>

  <!-- GASTOS -->
  <section class="view" data-view="gastos">
    <div class="navbar" id="navbar-gastos">
      <div class="navbar-row">
        <div>
          <div class="large-title">Gastos</div>
          <div class="subtitle" id="gastos-subtitle">Sin gastos</div>
        </div>
        <button class="nav-btn" id="btn-add-gasto" title="Agregar gasto">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
    <div style="padding:0 20px;">
      <div class="group" id="gastos-list"></div>
    </div>
  </section>

  <!-- PERSONAS -->
  <section class="view" data-view="personas">
    <div class="navbar" id="navbar-personas">
      <div class="navbar-row">
        <div>
          <div class="large-title">Personas</div>
          <div class="subtitle" id="personas-subtitle">Sin personas</div>
        </div>
        <button class="nav-btn" id="btn-add-persona" title="Agregar persona">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
    <div style="padding:0 20px;">
      <div class="group" id="personas-list"></div>
    </div>
  </section>

</div>

<div class="tabbar">
  <div class="tabbar-inner" id="tabbar-inner">
    <div class="tab-blob" id="tab-blob"></div>
    <button data-tab="resumen" class="active">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 15a9 9 0 1 1 18 0"/><path d="M12 15V7"/><path d="M12 15l5-3.2"/></svg>
      Resumen
    </button>
    <button data-tab="gastos">
      <svg class="icon" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6"/><path d="M9 12h6"/></svg>
      Gastos
    </button>
    <button data-tab="personas">

<script type="module">

  async function migrateLegacyData(){
    try{
      var raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if(!raw) return;
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.people) || parsed.people.length === 0){
        localStorage.removeItem(LEGACY_STORAGE_KEY);
        return;
      }
      var idMap = {};
      for(var i=0;i<parsed.people.length;i++){
        var p = parsed.people[i];
        var res = await supabase.from('people').insert({ group_id: groupId, name: p.name, paid: !!p.paid }).select('id').single();
        if(res.data) idMap[p.id] = res.data.id;
      }
      var expenses = Array.isArray(parsed.expenses) ? parsed.expenses : [];
      for(var j=0;j<expenses.length;j++){
        var e = expenses[j];
        var newPersonId = idMap[e.personId];
        if(!newPersonId) continue;
        await supabase.from('expenses').insert({ group_id: groupId, person_id: newPersonId, amount: e.amount, description: e.desc });
      }
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      showToast("Datos anteriores migrados");
    }catch(e){}
  }

  var DEFAULT_GROUP_ID = "15e24aa4-d662-4b08-ab23-7d3ea232c6e4";

  async function ensureGroup(){
    var id = getGroupIdFromUrl() || localStorage.getItem(GROUP_STORAGE_KEY) || DEFAULT_GROUP_ID;
    if(id){
      var existing = await supabase.from('groups').select('id').eq('id', id).maybeSingle();
      if(existing.data){
        groupId = id;
        localStorage.setItem(GROUP_STORAGE_KEY, id);
        setGroupIdInUrl(id);
        return;
      }
    }
    var created = await supabase.from('groups').insert({ name: 'Carne Asada' }).select('id').single();
    if(created.error || !created.data){
      showToast("No se pudo conectar con el servidor");
      return;

    groupId = created.data.id;
    localStorage.setItem(GROUP_STORAGE_KEY, groupId);
    setGroupIdInUrl(groupId);
    await migrateLegacyData();
  }

  async function fetchAll(){
    if(!groupId) return;
    var peopleRes = await supabase.from('people').select('*').eq('group_id', groupId).order('created_at');
    var expensesRes = await supabase.from('expenses').select('*').eq('group_id', groupId).order('created_at', { ascending:false });
    state.people = (peopleRes.data || []).map(function(p){ return { id:p.id, name:p.name, paid:p.paid }; });
    state.expenses = (expensesRes.data || []).map(function(e){ return { id:e.id, amount:Number(e.amount), desc:e.description, personId:e.person_id }; });
    renderAll();

  function adminPinKey(){ return 'carneAsadaAdminPin_' + groupId; }

    var pin = localStorage.getItem(adminPinKey()) || '';
    var res = await supabase.rpc('set_paid', { p_person_id: person.id, p_admin_pin: pin, p_paid: !person.paid });
    if(res.error || !res.data){ showToast("No se pudo actualizar"); return; }
    await fetchAll();
  }

  function attachToggleHandlers(container){
    container.querySelectorAll('[data-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(ev){
        ev.stopPropagation();
        if(!isAdmin()){ showToast("Solo el administrador puede marcar pagos"); return; }
        var p = state.people.find(function(x){ return x.id === btn.dataset.toggle; });
        if(p){ setPaid(p); }
      });
    });
  }

  function subscribeRealtime(){
    supabase.channel('group-' + groupId)
      .on('postgres_changes', { event:'*', schema:'public', table:'people', filter:'group_id=eq.' + groupId }, function(){ fetchAll(); })
      .on('postgres_changes', { event:'*', schema:'public', table:'expenses', filter:'group_id=eq.' + groupId }, function(){ fetchAll(); })
      .subscribe();
  }

  function fmt(n){
    var v = Math.round((n + Number.EPSILON) * 100) / 100;
    var neg = v < 0;
    v = Math.abs(v);
    var s = v.toLocaleString('es-MX', {minimumFractionDigits: v % 1 === 0 ? 0 : 2, maximumFractionDigits:2});
    return (neg ? "-$" : "$") + s;
  }

  function initials(name){
    var parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return "?";
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function personName(id){
    var p = state.people.find(function(x){ return x.id === id; });
    return p ? p.name : "\u2014";
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Toast ----------
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1700);
  }

  // ---------- Tabs ----------
  var tabButtons = document.querySelectorAll('.tabbar button');
  var viewSections = document.querySelectorAll('section.view');
  var tabbarInner = document.getElementById('tabbar-inner');
  var tabBlob = document.getElementById('tab-blob');

  function setTab(tab){
    tabButtons.forEach(function(b){
      b.classList.toggle('active', b.dataset.tab === tab);
      b.classList.remove('preview');
    });
    viewSections.forEach(function(s){ s.classList.toggle('active', s.dataset.view === tab); });
    renderAll();
    moveBlobToActive();
  }
  tabButtons.forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.dataset.tab); });
  });

  function nearestButtonAt(clientX){
    var best = null, bestDist = Infinity;
    tabButtons.forEach(function(b){
      var r = b.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var d = Math.abs(clientX - cx);
      if(d < bestDist){ bestDist = d; best = b; }
    });
    return best;
  }

  function positionBlobOn(btn, grabbed){
    if(!btn) return;
    var barRect = tabbarInner.getBoundingClientRect();
    var r = btn.getBoundingClientRect();
    tabBlob.style.width = r.width + 'px';
    var scale = grabbed ? 1.05 : 1;
    tabBlob.style.transform = 'translateX(' + (r.left - barRect.left) + 'px) scale(' + scale + ')';
  }

  function moveBlobToActive(){
    var activeBtn = document.querySelector('.tabbar button.active');
    positionBlobOn(activeBtn, false);
  }

  // Arrastre estilo iOS 26: la burbuja sigue la posicion real del dedo/cursor
  // (no salta entre botones), y solo confirma el cambio de pestana al soltar.
  var dragging = false;
  var pendingX = null;
  var rafId = null;

  function followFrame(){
    rafId = null;
    if(pendingX === null) return;
    var barRect = tabbarInner.getBoundingClientRect();
    var target = nearestButtonAt(pendingX);
    tabButtons.forEach(function(b){ b.classList.toggle('preview', b === target); });
    var w = target ? target.getBoundingClientRect().width : 80;
    var minX = 6;
    var maxX = barRect.width - 6 - w;
    var x = pendingX - barRect.left - (w / 2);
    x = Math.max(minX, Math.min(maxX, x));
    tabBlob.style.width = w + 'px';
    tabBlob.style.transform = 'translateX(' + x + 'px) scale(1.05)';
  }

  tabbarInner.addEventListener('pointerdown', function(ev){
    dragging = true;
    tabbarInner.setPointerCapture(ev.pointerId);
    tabBlob.classList.add('grabbed');
    pendingX = ev.clientX;
    followFrame();
  });
  tabbarInner.addEventListener('pointermove', function(ev){
    if(!dragging) return;
    pendingX = ev.clientX;
    if(rafId === null){ rafId = requestAnimationFrame(followFrame); }
  });
  function endDrag(ev){
    if(!dragging) return;
    dragging = false;
    if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    pendingX = null;
    tabBlob.classList.remove('grabbed');
    var target = nearestButtonAt(ev.clientX);
    tabButtons.forEach(function(b){ b.classList.remove('preview'); });
    if(target){ setTab(target.dataset.tab); }
  }
  tabbarInner.addEventListener('pointerup', endDrag);
  tabbarInner.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', moveBlobToActive);

  // ---------- Nav bar scroll shadow ----------

    var el = document.getElementById(id);

  window.addEventListener('scroll', function(){

      nb.classList.toggle('scrolled', window.scrollY > 2);

  // ---------- Sheets ----------

  function openSheet(sheet){

    sheetPersona.classList.remove('show');
    sheetGasto.classList.remove('show');
  }
  overlay.addEventListener('click', closeSheets);

  // ---------- Persona sheet ----------
  var personaTitle = document.getElementById('sheet-persona-title');
  var inputPersonaNombre = document.getElementById('input-persona-nombre');
  var btnPersonaSave = document.getElementById('btn-persona-save');
  var btnPersonaCancel = document.getElementById('btn-persona-cancel');
  var btnPersonaDelete = document.getElementById('btn-persona-delete');
  var rowPersonaDelete = document.getElementById('row-persona-delete');
  var editingPersonaId = null;

  function openPersonaSheet(id){

    if(id){
      var p = state.people.find(function(x){ return x.id === id; });

  btnPersonaCancel.addEventListener('click', closeSheets);

  btnPersonaSave.addEventListener('click', async function(){
    var name = inputPersonaNombre.value.trim();

  btnPersonaDelete.addEventListener('click', async function(){

  var btnGastoDelete = document.getElementById('btn-gasto-delete');
  var rowGastoDelete = document.getElementById('row-gasto-delete');
  var editingGastoId = null;

  function refreshPersonaSelect(){
    selectGastoPersona.innerHTML = "";
    if(state.people.length === 0){
      var opt = document.createElement('option');
      opt.textContent = "Agrega una persona primero";
      opt.value = "";
      selectGastoPersona.appendChild(opt);
      return;
    }
    state.people.forEach(function(p){
      var opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      selectGastoPersona.appendChild(opt);
    });
  }

  function openGastoSheet(id){
    if(state.people.length === 0){
      showToast("Agrega personas primero");
      setTab('personas');
      return;
    }
    editingGastoId = id;
    refreshPersonaSelect();
    if(id){
      var g = state.expenses.find(function(x){ return x.id === id; });
      gastoTitle.textContent = "Editar gasto";
      inputGastoMonto.value = g ? g.amount : "";
      inputGastoDesc.value = g ? g.desc : "";
      selectGastoPersona.value = g ? g.personId : "";
      rowGastoDelete.style.display = "flex";
    } else {
      gastoTitle.textContent = "Nuevo gasto";

      inputGastoDesc.value = "";

      rowGastoDelete.style.display = "none";

  btnGastoCancel.addEventListener('click', closeSheets);
  document.getElementById('btn-add-gasto').addEventListener('click', function(){ openGastoSheet(null); });

  btnGastoSave.addEventListener('click', async function(){
    var amount = parseFloat(inputGastoMonto.value);

    if(!desc){ desc = "Gasto sin descripcion"; }

    if(editingGastoId){
      await supabase.from('expenses').update({ amount: amount, description: desc, person_id: personId }).eq('id', editingGastoId);
    } else {
      await supabase.from('expenses').insert({ group_id: groupId, amount: amount, description: desc, person_id: personId });

    closeSheets();
    await fetchAll();
  });

  btnGastoDelete.addEventListener('click', async function(){
    if(!editingGastoId) return;
    if(!confirm("\u00bfEliminar este gasto?")) return;

    showToast("Eliminado");

  // ---------- SF-symbol-style icons (inline) ----------
  var ICON_RECEIPT = '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6"/><path d="M9 12h6"/></svg>';
  var ICON_CHECK = '<svg class="icon icon-sm" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:2.6;"><path d="M5 13l4 4L19 7"/></svg>';
  var ICON_CHEVRON = '<span class="chevron"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>';

  // ---------- Rendering ----------
  function computeBalances(){
    var n = state.people.length;
    var total = state.expenses.reduce(function(sum, e){ return sum + e.amount; }, 0);
    var cuota = n > 0 ? total / n : 0;
    var byPerson = state.people.map(function(p){
      var spent = state.expenses
        .filter(function(e){ return e.personId === p.id; })
        .reduce(function(s,e){ return s + e.amount; }, 0);
      return { id: p.id, name: p.name, spent: spent, balance: spent - cuota, paid: p.paid };
    });
    return { total: total, cuota: cuota, n: n, byPerson: byPerson };
  }

  function renderResumen(){
    var data = computeBalances();
    document.getElementById('r-total').textContent = fmt(data.total);
    document.getElementById('r-cuota').textContent = fmt(data.cuota);
    document.getElementById('r-personas').textContent = String(data.n);

    var sub = document.getElementById('r-subtitle');
    if(data.n === 0){
      sub.textContent = "Agrega personas y gastos para empezar";
    } else if(state.expenses.length === 0){
      sub.textContent = "Aun no hay gastos registrados";
    } else {
      sub.textContent = data.n + " persona" + (data.n === 1 ? "" : "s") + " \u00b7 " + state.expenses.length + " gasto" + (state.expenses.length === 1 ? "" : "s");
    }

    var box = document.getElementById('r-balances');
    box.innerHTML = "";
    if(data.byPerson.length === 0){
      box.innerHTML = '<div class="empty"><svg class="icon" viewBox="0 0 24 24" style="width:34px;height:34px;margin:0 auto 12px;color:var(--label-3);"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c2.3.3 4 2.3 4.5 5.8"/></svg><div class="msg">Sin personas todavia</div><div class="sub">Ve a la pestana Personas para agregar al grupo</div></div>';
      return;
    }
    data.byPerson
      .slice()
      .sort(function(a,b){ return b.balance - a.balance; })
      .forEach(function(p){
        var row = document.createElement('div');
        row.className = 'row';
        var cls = Math.abs(p.balance) < 0.5 ? 'zero' : (p.balance > 0 ? 'pos' : 'neg');

          '</div>';
        box.appendChild(row);

    if(state.expenses.length === 0){
      list.innerHTML = '<div class="empty">' + ICON_RECEIPT.replace('icon-sm','').replace('width:22px','width:34px') + '<div class="msg">Sin gastos todavia</div><div class="sub">Toca + para agregar el primero</div></div>';
      return;

    state.expenses
      .slice()
      .sort(function(a,b){ return b.id.localeCompare(a.id); })

        var row = document.createElement('div');
        row.className = 'row tappable';
        row.dataset.open = e.id;
        row.innerHTML =
          '<div class="row-icon" style="background:var(--fill); color:var(--label-2);">' + ICON_RECEIPT + '</div>' +
          '<div class="row-body">' +
            '<div class="row-title">' + escapeHtml(e.desc) + '</div>' +
            '<div class="row-subtitle">' + escapeHtml(personName(e.personId)) + '</div>' +
          '</div>' +
          '<div class="row-value strong">' + fmt(e.amount) + '</div>' +
          ICON_CHEVRON;
        list.appendChild(row);
      });

    list.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener('click', function(){ openGastoSheet(el.dataset.open); });
    });
  }

  function renderPersonas(){
    var list = document.getElementById('personas-list');
    var sub = document.getElementById('personas-subtitle');
    list.innerHTML = "";
    sub.textContent = state.people.length === 0 ? "Sin personas" : (state.people.length + " persona" + (state.people.length === 1 ? "" : "s"));

    if(state.people.length === 0){
      list.innerHTML = '<div class="empty"><svg class="icon" viewBox="0 0 24 24" style="width:34px;height:34px;margin:0 auto 12px;color:var(--label-3);"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c2.3.3 4 2.3 4.5 5.8"/></svg><div class="msg">Sin personas todavia</div><div class="sub">Toca + para agregar al grupo</div></div>';
      return;
    }
    var data = computeBalances();
    state.people.forEach(function(p){
      var bp = data.byPerson.find(function(x){ return x.id === p.id; });
      var settledText = p.paid ? "Liquidado" : (bp && Math.abs(bp.balance) < 0.5 ? "Al dia" : "Pendiente");
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<button class="paid-toggle ' + (p.paid ? 'on' : '') + '" data-toggle="' + p.id + '" title="Marcar como liquidado">' + (p.paid ? ICON_CHECK : '') + '</button>' +
        '<div class="avatar">' + initials(p.name) + '</div>' +
        '<div class="row-body" data-open="' + p.id + '">' +
          '<div class="row-title">' + escapeHtml(p.name) + '</div>' +
          '<div class="row-subtitle">Gasto ' + fmt(bp ? bp.spent : 0) + ' \u00b7 ' + settledText + '</div>' +
        '</div>' +
        '<div data-open="' + p.id + '">' + ICON_CHEVRON + '</div>';
      list.appendChild(row);
    });
    list.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener('click', function(){ openPersonaSheet(el.dataset.open); });
    });
    attachToggleHandlers(list);
  }

  function renderAll(){
    renderResumen();
    renderGastos();
    renderPersonas();
  }

  // ---------- PDF export ----------
  document.getElementById('btn-export-pdf').addEventListener('click', function(){
    var data = computeBalances();
    if(data.n === 0){ showToast("Agrega personas primero"); return; }
    var meta = document.getElementById('print-meta');
    var today = new Date();
    meta.textContent = "Generado el " + today.toLocaleDateString('es-MX', {day:'numeric', month:'long', year:'numeric'}) + " \u00b7 " + data.n + " personas \u00b7 " + state.expenses.length + " gastos";

    var tbody = document.getElementById('print-tbody');
    tbody.innerHTML = "";
    data.byPerson.forEach(function(p){
      var tr = document.createElement('tr');
      var cls = p.balance >= -0.5 && p.balance <= 0.5 ? '' : (p.balance > 0 ? 'pos' : 'neg');
      var balTxt = Math.abs(p.balance) < 0.5 ? 'Al dia' : (p.balance > 0 ? 'Le deben ' + fmt(p.balance) : 'Debe ' + fmt(Math.abs(p.balance)));
      tr.innerHTML = '<td>' + escapeHtml(p.name) + '</td><td>' + fmt(p.spent) + '</td><td>' + fmt(data.cuota) + '</td><td class="' + cls + '">' + balTxt + '</td>';
      tbody.appendChild(tr);
    });

    document.getElementById('print-totals').textContent = "Total del evento: " + fmt(data.total) + "  \u00b7  Cuota por persona: " + fmt(data.cuota);

    window.print();
  });

  // ---------- Admin ----------
  var btnAdmin = document.getElementById('btn-admin');
  function refreshAdminBtn(){
    btnAdmin.classList.toggle('is-admin', isAdmin());
  }
  btnAdmin.addEventListener('click', async function(){
    await activateAdmin();
    refreshAdminBtn();
  });

  // ---------- Share ----------
  document.getElementById('btn-share').addEventListener('click', async function(){
    var url = window.location.href;
    try{
      if(navigator.share){
        await navigator.share({ title: 'Carne Asada · Gastos', url: url });
        return;
      }
    }catch(e){ return; }
    try{
      await navigator.clipboard.writeText(url);
      showToast("Link copiado");
    }catch(e){
      showToast(url);
    }
  });

  // ---------- Init ----------
  async function init(){
    await ensureGroup();
    if(!groupId) return;
    refreshAdminBtn();
    await fetchAll();
    subscribeRealtime();
    setTab('resumen');
    setTimeout(moveBlobToActive, 60);
  }
  init();

})();
</script>

</body>
</html>
